<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Split the bill</title>
<style>
  :root{
    --bg:#f2f2f7; --card:#fff; --card2:#fff; --ink:#000; --ink2:#6c6c70;
    --line:#d8d8dd; --accent:#0a7cff; --accent-ink:#fff; --ok:#1f9d55;
    --bar:rgba(248,248,250,.86); --shadow:0 1px 3px rgba(0,0,0,.07);
    --radius:14px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --ink:#fff; --ink2:#98989f;
      --line:#38383a; --accent:#0a84ff; --bar:rgba(28,28,30,.86);
      --shadow:none;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:400 17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0 16px calc(var(--barh, 200px) + 24px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:560px;margin:0 auto}

  header{padding:28px 2px 4px}
  h1{font-size:32px;line-height:1.15;letter-spacing:-.5px;font-weight:800;margin:0 0 6px}
  .sub{color:var(--ink2);font-size:15px;margin:0}
  .sub b{color:var(--ink);font-weight:600}


  .item{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    margin:12px 0;padding:14px;border:2px solid transparent;transition:border-color .15s;
  }
  @media (prefers-reduced-motion:reduce){.item{transition:none}}
  .item.on{border-color:var(--accent)}
  .top{display:flex;align-items:center;gap:13px;cursor:pointer;min-height:30px}
  .box{
    flex:0 0 auto;width:27px;height:27px;border-radius:7px;border:2px solid var(--line);
    background:transparent;display:grid;place-items:center;
  }
  .item.on .box{background:var(--accent);border-color:var(--accent)}
  .box svg{width:16px;height:16px;opacity:0;stroke:#fff;stroke-width:3;fill:none;
    stroke-linecap:round;stroke-linejoin:round}
  .item.on .box svg{opacity:1}
  .nm{flex:1 1 auto;font-size:19px;font-weight:600;letter-spacing:-.2px;min-width:0}
  .nm small{display:block;font-weight:400;font-size:13px;color:var(--ink2);letter-spacing:0}
  .nm small.addon{color:var(--accent)}
  .ledger i{font-style:normal;color:var(--accent);font-size:12px;margin-left:4px}
  .pr{flex:0 0 auto;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}

  .item.ro{opacity:.85}
  .item.ro .top{cursor:default}
  .item.ro .nm{font-weight:500}
  .evenhead{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px;margin:16px 0 4px;text-align:center;
  }
  .evenhead .big{font-size:38px;font-weight:800;letter-spacing:-1px;
    font-variant-numeric:tabular-nums;line-height:1.1}
  .evenhead .lbl2{font-size:15px;color:var(--ink2);margin:0 0 4px}
  .evenhead .math{font-size:14px;color:var(--ink2);margin:6px 0 0;
    font-variant-numeric:tabular-nums}
  .rolist{font-size:13px;color:var(--ink2);margin:18px 2px 4px;font-weight:600;
    text-transform:uppercase;letter-spacing:.5px}
  .ctl{display:none;padding:14px 0 2px;margin-top:12px;border-top:1px solid var(--line)}
  .item.on .ctl{display:block}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .row:last-child{margin-bottom:0}
  .lbl{font-size:15px;color:var(--ink2);flex:0 0 auto}

  .step{display:flex;align-items:center;gap:8px}
  .step button{
    width:44px;height:38px;border-radius:9px;border:1px solid var(--line);
    background:var(--card2);color:var(--accent);font-size:22px;font-weight:500;
    display:grid;place-items:center;cursor:pointer;padding:0;
  }
  @media (prefers-color-scheme:light){.step button{background:#f2f2f7}}
  .step button:disabled{color:var(--ink2);opacity:.4;cursor:default}
  .step .val{
    min-width:64px;height:38px;border:1px solid var(--line);border-radius:9px;
    display:grid;place-items:center;font-size:17px;font-weight:600;
    font-variant-numeric:tabular-nums;background:transparent;
  }
  .of{font-size:15px;color:var(--ink2)}

  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{
    min-width:50px;height:42px;padding:0 9px;border-radius:9px;border:1px solid var(--line);
    background:var(--card2);color:var(--ink);font-size:16px;font-weight:500;cursor:pointer;
    display:grid;place-items:center;
  }
  @media (prefers-color-scheme:light){.chip{background:#f2f2f7}}
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .chip small{font-size:11px;display:block;line-height:1;opacity:.75;margin-top:2px}

  .yours{
    margin-top:12px;padding-top:11px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:baseline;font-size:16px;
    gap:10px;flex-wrap:wrap;
  }
  .calc{
    margin-left:auto;font-size:14px;color:var(--ink2);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .yours b{font-size:19px;font-variant-numeric:tabular-nums}

  /* ---- pinned summary ---- */
  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--bar);backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-top:1px solid var(--line);
    padding:10px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .bar .wrap{display:block}
  .brk{display:none;padding:2px 0 8px;font-size:15px}
  .brk.open{display:block}
  .brk div{display:flex;justify-content:space-between;padding:4px 0;color:var(--ink2)}
  .brk div span:last-child{font-variant-numeric:tabular-nums;color:var(--ink)}
  .tot{
    display:flex;justify-content:space-between;align-items:center;
    padding:4px 0 10px;cursor:pointer;
  }
  .tot .l{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:600}
  .tot .l svg{width:13px;height:13px;stroke:var(--ink2);stroke-width:2.5;fill:none;
    transition:transform .18s}
  .brk.open ~ .tot .l svg,.tot.open .l svg{transform:rotate(180deg)}
  .tot .r{font-size:30px;font-weight:800;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
  .cta{
    width:100%;height:54px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;letter-spacing:-.2px;
    font-family:inherit;
  }
  .cta:disabled{opacity:.35;cursor:default}
  .alt{
    display:flex;gap:8px;margin-top:8px;
  }
  .alt button{
    flex:1;height:38px;border:0;background:transparent;color:var(--accent);
    font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .hint{text-align:center;font-size:12px;color:var(--ink2);margin:8px 0 0}

  /* ---- modal ---- */
  .modal{
    position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);
    display:none;place-items:center;padding:20px;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  }
  .modal.open{display:grid}
  .modal{padding:14px}
  .sheet{
    background:#fff;color:#000;border-radius:20px;padding:18px;max-width:460px;width:100%;
    max-height:90vh;overflow:auto;text-align:center;
  }
  .sheet h2{margin:0 0 4px;font-size:21px}
  .sheet p{margin:0 0 16px;font-size:14px;color:#6c6c70}
  #qrbox{display:grid;place-items:center}
  #qrbox svg{width:100%;height:auto;display:block}
  .sheet .cta{background:#0a7cff;margin-top:16px}
  .sheet .ghost{
    background:transparent;color:#0a7cff;height:44px;width:100%;border:0;
    font-size:16px;font-weight:600;cursor:pointer;margin-top:4px;font-family:inherit;
  }

  /* ---- host tools ---- */
  .hosttools{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:14px;margin:16px 0;display:none;
  }
  .hosttools.on{display:block}
  .hosttools h3{margin:0 0 2px;font-size:17px}
  .hosttools .note{font-size:13px;color:var(--ink2);margin:0 0 12px}
  .hb{display:flex;gap:8px;margin-bottom:12px}
  .hb button{
    flex:1;height:42px;border-radius:10px;border:1px solid var(--accent);
    background:transparent;color:var(--accent);font-size:15px;font-weight:600;
    cursor:pointer;font-family:inherit;
  }
  .ledger label{
    display:flex;align-items:center;gap:10px;padding:9px 0;
    border-top:1px solid var(--line);font-size:16px;cursor:pointer;
  }
  .ledger input{width:22px;height:22px;accent-color:var(--ok);flex:0 0 auto}
  .ledger .n{flex:1;min-width:0}
  .ledger label.done .n{text-decoration:line-through;color:var(--ink2)}
  .ledger .p{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:15px}
  .tally{
    display:flex;justify-content:space-between;padding-top:12px;margin-top:4px;
    border-top:1px solid var(--line);font-size:16px;font-weight:600;
  }
  .tally span:last-child{font-variant-numeric:tabular-nums}
  .tally .over{
    flex:1 0 100%;font-size:12px;font-weight:400;color:var(--ink2);
    margin-top:6px;font-variant-numeric:normal;
  }
  .tally{flex-wrap:wrap}

  .err{padding:60px 4px;text-align:center;color:var(--ink2)}
  .err h1{font-size:24px;color:var(--ink);margin-bottom:10px}
  .toast{
    position:fixed;left:50%;bottom:calc(var(--barh,200px) + 20px + env(safe-area-inset-bottom));
    transform:translateX(-50%);background:#000;color:#fff;padding:10px 18px;
    border-radius:22px;font-size:14px;font-weight:600;z-index:80;opacity:0;
    pointer-events:none;transition:opacity .2s;white-space:nowrap;
  }
  @media (prefers-color-scheme:dark){.toast{background:#3a3a3c}}
  .toast.on{opacity:1}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<div class="bar" id="bar" hidden>
  <div class="wrap">
    <div class="brk" id="brk"></div>
    <div class="tot" id="tot" role="button" tabindex="0" aria-expanded="false">
      <div class="l" id="totlbl">Your total
        <svg viewBox="0 0 24 24"><polyline points="6 15 12 9 18 15"/></svg>
      </div>
      <div class="r" id="totv">$0.00</div>
    </div>
    <button class="cta" id="pay" disabled>Pick your items</button>
    <div class="alt" id="alt">
      <button id="copyamt">Copy amount</button>
      <button id="showqr">Show QR code</button>
    </div>
    <p class="hint" id="hint"></p>
  </div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="QR code">
  <div class="sheet">
    <h2 id="qrtitle">Scan to split</h2>
    <p id="qrsub">Everyone scans this, picks their items, and pays.</p>
    <div id="qrbox"></div>
    <button class="cta" id="qrclose">Done</button>
    <button class="ghost" id="qrcopy">Copy link instead</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

var $ = function(id){ return document.getElementById(id); };
var app = $('app');
var BILL = null, STATE = [], HOST = false, EVEN = false, RO = false, KEY = '';

/* ---------- money ---------- */
function money(n){
  var s = (Math.round(Math.abs(n)*100)/100).toFixed(2);
  return (n<0?'-$':'$') + s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function r2(n){ return Math.round(n*100)/100; }

/* ---------- fragment decode ---------- */
function b64urlToBytes(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length % 4) s += '=';
  var bin = atob(s), out = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
function inflate(bytes){
  if(typeof DecompressionStream === 'undefined'){
    return Promise.reject(new Error('nostream'));
  }
  var ds = new DecompressionStream('deflate-raw');
  var stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Response(stream).text();
}
function loadFragment(){
  var raw = location.hash.replace(/^#/,'');
  if(!raw) return Promise.reject(new Error('empty'));
  var parts = raw.split('.');
  var body = parts[0];
  HOST = parts.indexOf('h') > 0;
  var tag = body.charAt(0), data = body.slice(1);
  if(tag === 'z') return inflate(b64urlToBytes(data)).then(JSON.parse);
  if(tag === 'j') return Promise.resolve(JSON.parse(new TextDecoder().decode(b64urlToBytes(data))));
  return Promise.reject(new Error('badtag'));
}

/* ---------- guest link (strip host flag) ---------- */
function guestURL(){
  return location.origin + location.pathname + '#' + location.hash.replace(/^#/,'').split('.')[0];
}

/* ---------- render ---------- */
var FRACS = [2,3,4,5,6,8];
var GLYPH = {2:'\u00bd',3:'\u2153',4:'\u00bc',5:'\u2155',6:'\u2159',8:'\u215B'};

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

function render(){
  var b = BILL;
  var gross = b.s + b.x + b.p + b.f;
  var h = '';
  h += '<header><h1>' + (EVEN ? 'Split evenly' : HOST ? 'The bill' : 'Pick your items') +
       '</h1><p class="sub">';
  h += b.r ? '<b>'+esc(b.r)+'</b>' : 'This bill';
  h += ' \u00b7 ' + money(gross) + ' total';
  if(EVEN) h += ' \u00b7 ' + b.e + ' ways';
  if(b.m) h += '<br>' + esc(b.m);
  h += '</p></header>';
  if(EVEN){
    h += '<div class="evenhead"><p class="lbl2">' + (HOST ? 'Each share' : 'Your share') + '</p>' +
         '<div class="big">' + money(evenShare()) + '</div>' +
         '<p class="math">' + money(gross) + ' \u00f7 ' + b.e + '</p></div>';
    h += '<p class="rolist">What was on the bill</p>';
  }

  h += '<div class="hosttools' + (HOST?' on':'') + '" id="host"></div>';
  if(HOST && !EVEN) h += '<p class="rolist">What was on the bill</p>';

  b.i.forEach(function(it, idx){
    var name = it[0], unit = it[1], qty = it[2], shared = !!it[3], addon = it[4] || '';
    var line = r2(unit*qty);
    h += '<div class="item'+(RO?' ro':'')+'" id="it'+idx+'" data-i="'+idx+'">';
    h +=   RO ? '<div class="top">'
              : '<div class="top" role="checkbox" aria-checked="false" tabindex="0" data-toggle="'+idx+'">';
    if(!RO)
      h +=   '<div class="box"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg></div>';
    h +=     '<div class="nm">'+esc(name);
    if(qty > 1) h += '<small>'+qty+' on the bill \u00b7 '+money(unit)+' each</small>';
    if(addon) h += '<small class="addon">'+esc(addon)+'</small>';
    h +=     '</div>';
    h +=     '<div class="pr">'+money(line)+'</div>';
    h +=   '</div>';
    if(RO){ h += '</div>'; return; }
    h +=   '<div class="ctl">';
    if(qty > 1){
      h += '<div class="row"><span class="lbl">How many</span><div class="step">' +
           '<button id="d'+idx+'" data-step="'+idx+'|-1" aria-label="one fewer">\u2212</button>' +
           '<div class="val" id="u'+idx+'">1</div>' +
           '<button id="p'+idx+'" data-step="'+idx+'|1" aria-label="one more">+</button>' +
           '</div><span class="of">of '+qty+'</span></div>';
    }
    h += '<div class="row"><span class="lbl">Split it</span><div class="chips">' +
         '<button class="chip on" data-div="'+idx+'|1">Just me</button>';
    FRACS.forEach(function(f){
      h += '<button class="chip" data-div="'+idx+'|'+f+'">'+GLYPH[f]+'<small>'+f+' ways</small></button>';
    });
    h += '</div></div>';
    h += '<div class="yours"><span>Your share</span>' +
         '<span class="calc" id="c'+idx+'"></span>' +
         '<b id="y'+idx+'">'+money(unit)+'</b></div>';
    h +=   '</div>';
    h += '</div>';
  });

  app.innerHTML = h;
  if(HOST){
    $('pay').onclick = openQR;          // not payVenmo: never pay yourself
    $('alt').style.display = 'none';    // host tools above already has these
  }
  $('totlbl').childNodes[0].nodeValue = HOST ? 'Bill total' : EVEN ? 'Your share' : 'Your total';
  $('bar').hidden = false;
  if(HOST) renderHost();
  fitBar();
}

/* ---------- math ---------- */
// round the per-person share UP so the host is never left short
function evenShare(){
  var gross = BILL.s + BILL.x + BILL.p + BILL.f;
  return Math.ceil((gross / BILL.e) * 100) / 100;
}
function claimUnits(i){ var s = STATE[i]; return s.on ? s.units / s.div : 0; }
function itemShare(i){ return BILL.i[i][1] * claimUnits(i); }

function recalc(){
  if(HOST) return recalcHost();
  if(EVEN) return recalcEven();
  var sub = 0;
  BILL.i.forEach(function(it, i){ sub += itemShare(i); });
  sub = r2(sub);
  var tax = r2(sub * (BILL.s>0 ? BILL.x/BILL.s : 0));
  var tip = r2(sub * (BILL.s>0 ? BILL.p/BILL.s : 0));
  var fee = r2(sub * (BILL.s>0 ? BILL.f/BILL.s : 0));
  var total = r2(sub + tax + tip + fee);

  BILL.i.forEach(function(it, i){
    var el = $('y'+i); if(el) el.textContent = money(itemShare(i));
    var u = $('u'+i); if(u) u.textContent = STATE[i].units;
    var c = $('c'+i); if(c) c.textContent = calcText(i);
    var dec = $('d'+i), inc = $('p'+i);
    if(dec) dec.disabled = STATE[i].units <= 1;
    if(inc) inc.disabled = STATE[i].units >= BILL.i[i][2];
  });

  $('totv').textContent = money(total);
  $('brk').innerHTML =
    '<div><span>Items you picked</span><span>'+money(sub)+'</span></div>' +
    '<div><span>Tax</span><span>'+money(tax)+'</span></div>' +
    '<div><span>Tip</span><span>'+money(tip)+'</span></div>' +
    (BILL.f > 0 ? '<div><span>Fees</span><span>'+money(fee)+'</span></div>' : '');

  var pay = $('pay');
  pay.disabled = total <= 0 || !BILL.h;
  pay.textContent = !BILL.h ? 'No payee on this link'
    : total <= 0 ? 'Pick your items'
    : BILL.y ? 'Pay ' + BILL.y + ' ' + money(total)
    : 'Pay ' + money(total) + ' with Venmo';
  $('hint').textContent = !BILL.h ? 'Ask whoever sent this for a new link.'
    : total > 0 ? 'Opens Venmo to @' + BILL.h + '. Check the amount before you send.'
    : '';
  save();
  if(HOST) tally();
  return total;
}
function calcText(i){
  var st = STATE[i], unit = BILL.i[i][1];
  if(!st.on) return '';
  if(st.units === 1 && st.div === 1) return '';
  return (st.units > 1 ? st.units + ' \u00d7 ' : '') + money(unit) +
         (st.div > 1 ? ' \u00f7 ' + st.div : '');
}
function recalcEven(){
  var gross = BILL.s + BILL.x + BILL.p + BILL.f, total = evenShare();
  $('totv').textContent = money(total);
  $('brk').innerHTML =
    '<div><span>Whole bill</span><span>'+money(gross)+'</span></div>' +
    '<div><span>Split between</span><span>'+BILL.e+' people</span></div>';
  var pay = $('pay');
  pay.disabled = !BILL.h;
  pay.textContent = !BILL.h ? 'No payee on this link'
    : BILL.y ? 'Pay ' + BILL.y + ' ' + money(total)
    : 'Pay ' + money(total) + ' with Venmo';
  $('hint').textContent = !BILL.h ? 'Ask whoever sent this for a new link.'
    : 'Opens Venmo to @' + BILL.h + '. Check the amount before you send.';
  if(HOST) tally();
  return total;
}
/* The host is collecting, not paying. Show the whole bill and put the QR
   — the only thing they actually need from this screen — on the main button. */
function recalcHost(){
  var gross = BILL.s + BILL.x + BILL.p + BILL.f;
  $('totv').textContent = money(gross);
  $('brk').innerHTML =
    '<div><span>Items</span><span>'+money(BILL.s)+'</span></div>' +
    '<div><span>Tax</span><span>'+money(BILL.x)+'</span></div>' +
    '<div><span>Tip</span><span>'+money(BILL.p)+'</span></div>' +
    (BILL.f > 0 ? '<div><span>Fees</span><span>'+money(BILL.f)+'</span></div>' : '');

  var pay = $('pay');
  pay.disabled = false;
  pay.textContent = 'Show QR code';
  $('hint').textContent = EVEN
    ? 'Everyone scans this and sees their share.'
    : 'Everyone scans this and picks their own items.';
  tally();
  return gross;
}

function fmtUnits(s){
  var v = s.units / s.div;
  return (Math.abs(v - Math.round(v)) < 1e-9) ? String(Math.round(v))
       : String(Math.round(v*100)/100);
}

/* ---------- interaction ---------- */
function toggle(i){
  STATE[i].on = !STATE[i].on;
  var el = $('it'+i);
  el.classList.toggle('on', STATE[i].on);
  el.querySelector('.top').setAttribute('aria-checked', STATE[i].on ? 'true':'false');
  recalc();
}
function setDiv(i, d){
  STATE[i].div = d;
  STATE[i].on = true;
  $('it'+i).classList.add('on');
  $('it'+i).querySelector('.top').setAttribute('aria-checked','true');
  var chips = $('it'+i).querySelectorAll('[data-div]');
  for(var k=0;k<chips.length;k++){
    chips[k].classList.toggle('on', chips[k].dataset.div === i+'|'+d);
  }
  recalc();
}
function step(i, delta){
  var qty = BILL.i[i][2];
  STATE[i].units = Math.max(1, Math.min(qty, STATE[i].units + delta));
  STATE[i].on = true;
  $('it'+i).classList.add('on');
  recalc();
}

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-toggle],[data-div],[data-step]');
  if(!t) return;
  if(t.dataset.toggle !== undefined){ toggle(+t.dataset.toggle); return; }
  if(t.dataset.div){ var a = t.dataset.div.split('|'); setDiv(+a[0], +a[1]); return; }
  if(t.dataset.step){ var s = t.dataset.step.split('|'); step(+s[0], +s[1]); return; }
});
document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter' && e.key !== ' ') return;
  var t = e.target.closest('[data-toggle]');
  if(t){ e.preventDefault(); toggle(+t.dataset.toggle); }
});

/* ---------- persistence (survives a refresh; safe if blocked) ---------- */
function save(){
  try{ localStorage.setItem('sc:'+KEY, JSON.stringify(STATE)); }catch(e){}
}
function restore(){
  try{
    var s = localStorage.getItem('sc:'+KEY);
    if(s){
      var v = JSON.parse(s);
      if(v.length === STATE.length) STATE = v;
    }
  }catch(e){}
}

/* ---------- venmo ---------- */
function note(){
  if(EVEN){
    var head0 = BILL.r ? BILL.r + ': ' : 'Shared bill: ';
    return head0 + '1/' + BILL.e + ' of the bill';
  }
  var picked = [];
  BILL.i.forEach(function(it, i){
    if(!STATE[i].on) return;
    var u = fmtUnits(STATE[i]);
    picked.push(it[0] + (u === '1' ? '' : ' x' + u));
  });
  var head = BILL.r ? BILL.r + ': ' : 'Shared bill: ';
  var s = head + picked.join(', ');
  return s.length > 240 ? s.slice(0, 237) + '\u2026' : s;
}
function payVenmo(){
  var total = recalc();
  if(total <= 0) return;
  var amt = total.toFixed(2);
  var q = 'txn=pay&recipients=' + encodeURIComponent(BILL.h) +
          '&amount=' + amt + '&note=' + encodeURIComponent(note());
  var web = 'https://venmo.com/?' + q;
  var deep = 'venmo://paycharge?' + q;
  var left = false;
  var onHide = function(){ left = true; };
  document.addEventListener('visibilitychange', onHide, {once:true});
  window.location.href = deep;
  setTimeout(function(){
    document.removeEventListener('visibilitychange', onHide);
    if(!left && !document.hidden) window.location.href = web;
  }, 1200);
  toast('Amount is ' + money(total) + ' \u2014 double-check it');
}

/* ---------- clipboard / toast ---------- */
function toast(msg){
  var t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('on'); }, 2600);
}
function copy(text, msg){
  var done = function(){ toast(msg); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text, done); });
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('Copy failed'); }
  document.body.removeChild(ta);
}

/* ---------- QR ---------- */
function drawQR(){
  var url = guestURL();
  var box = $('qrbox');
  box.innerHTML = '';
  var ec = url.length > 900 ? 'L' : 'M';
  var q;
  try{
    q = qrcode(0, ec); q.addData(url); q.make();
  }catch(err){
    box.innerHTML = '<p style="color:#c00">This bill is too long for one QR code. ' +
                    'Send the link instead.</p>';
    return;
  }
  var n = q.getModuleCount(), pad = 4, size = n + pad*2;
  var d = '';
  for(var r=0;r<n;r++) for(var c=0;c<n;c++)
    if(q.isDark(r,c)) d += 'M' + (c+pad) + ' ' + (r+pad) + 'h1v1h-1z';
  box.innerHTML =
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+size+' '+size+'" ' +
    'shape-rendering="crispEdges" role="img" aria-label="QR code to this bill">' +
    '<rect width="'+size+'" height="'+size+'" fill="#fff"/>' +
    '<path d="'+d+'" fill="#000"/></svg>';
  $('qrsub').textContent = n > 89
    ? 'Dense code \u2014 turn your brightness up and hold steady.'
    : 'Everyone scans this, picks their items, and pays.';
}
function openQR(){ drawQR(); $('modal').classList.add('open'); }
function closeQR(){ $('modal').classList.remove('open'); }

/* ---------- host ledger ---------- */
function renderHost(){
  var h = '<h3>Host tools</h3><p class="note">Only you see this. ' +
          'Tick people off as their Venmo payments land.</p>' +
          '<div class="hb"><button id="hqr">Show QR</button>' +
          '<button id="hlink">Copy guest link</button></div><div class="ledger" id="ledger">';
  if(EVEN){
    var sh = evenShare();
    for(var n=1;n<=BILL.e;n++){
      h += '<label data-led="'+(n-1)+'"><input type="checkbox">' +
           '<span class="n">Share '+n+(n===1?' (yours)':'')+'</span>' +
           '<span class="p">'+money(sh)+'</span></label>';
    }
  } else {
    BILL.i.forEach(function(it, i){
      h += '<label data-led="'+i+'"><input type="checkbox"><span class="n">'+esc(it[0])+
           (it[2]>1 ? ' \u00d7'+it[2] : '') +
           (it[4] ? ' <i>'+esc(it[4])+'</i>' : '') + '</span>' +
           '<span class="p">'+money(it[1]*it[2])+'</span></label>';
    });
  }
  h += '</div><div class="tally" id="tallyv"></div>';
  $('host').innerHTML = h;
  $('hqr').onclick = openQR;
  $('hlink').onclick = function(){ copy(guestURL(), 'Guest link copied'); };
  $('ledger').addEventListener('change', function(e){
    e.target.closest('label').classList.toggle('done', e.target.checked);
    saveLedger(); tally();
  });
  restoreLedger();
  tally();
}
function ledgerState(){
  return Array.prototype.map.call(
    document.querySelectorAll('#ledger input'), function(x){ return x.checked ? 1 : 0; });
}
function saveLedger(){
  try{ localStorage.setItem('scL:'+KEY, ledgerState().join('')); }catch(e){}
}
function restoreLedger(){
  try{
    var s = localStorage.getItem('scL:'+KEY); if(!s) return;
    var ins = document.querySelectorAll('#ledger input');
    for(var i=0;i<ins.length && i<s.length;i++){
      ins[i].checked = s[i] === '1';
      ins[i].closest('label').classList.toggle('done', ins[i].checked);
    }
  }catch(e){}
}
function tally(){
  var ins = document.querySelectorAll('#ledger input');
  var gross = BILL.s + BILL.x + BILL.p + BILL.f, got, left;
  if(EVEN){
    var sh = evenShare(), n = 0;
    for(var k=0;k<ins.length;k++) if(ins[k].checked) n++;
    got = r2(n * sh);
    left = r2(Math.max(0, (BILL.e - n) * sh));
    var over = r2(BILL.e * sh - gross);
    $('tallyv').innerHTML = '<span>Still owed to you (' + (BILL.e - n) + ' of ' +
      BILL.e + ')</span><span>' + money(left) + '</span>' +
      (over > 0 ? '<span class="over">Rounding up leaves you ' + money(over) +
                  ' ahead once everyone pays.</span>' : '');
    return;
  }
  var settled = 0;
  BILL.i.forEach(function(it, i){ if(ins[i] && ins[i].checked) settled += it[1]*it[2]; });
  var rate = BILL.s > 0 ? gross / BILL.s : 1;
  got = r2(settled * rate); left = r2(gross - got);
  $('tallyv').innerHTML = '<span>Still owed to you</span><span>' + money(left) + '</span>';
}

/* ---------- keep content clear of the pinned bar ---------- */
function fitBar(){
  var bar = $('bar'); if(!bar) return;
  var h = bar.offsetHeight;
  if(h) document.body.style.setProperty('--barh', h + 'px');
}
if(typeof ResizeObserver !== 'undefined') new ResizeObserver(fitBar).observe($('bar'));
window.addEventListener('resize', fitBar);
window.addEventListener('orientationchange', fitBar);

/* ---------- wire up chrome ---------- */
$('tot').onclick = function(){
  var b = $('brk'), open = b.classList.toggle('open');
  this.classList.toggle('open', open);
  this.setAttribute('aria-expanded', open ? 'true' : 'false');
};
$('tot').onkeydown = function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); this.onclick(); } };
$('pay').onclick = payVenmo;
$('copyamt').onclick = function(){ copy(recalc().toFixed(2), 'Amount copied'); };
$('showqr').onclick = openQR;
$('qrclose').onclick = closeQR;
$('qrcopy').onclick = function(){ copy(guestURL(), 'Link copied'); };
$('modal').onclick = function(e){ if(e.target === this) closeQR(); };
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeQR(); });

/* ---------- a new bill pasted into the same tab ---------- */
window.addEventListener('hashchange', function(){ location.reload(); });

/* ---------- boot ---------- */
function fail(title, msg){
  app.innerHTML = '<div class="err"><h1>'+esc(title)+'</h1><p>'+esc(msg)+'</p></div>';
  $('bar').hidden = true;
}
loadFragment().then(function(bill){
  if(!bill || !bill.i || !bill.i.length) throw new Error('empty');
  BILL = bill;
  BILL.s = +BILL.s || 0; BILL.x = +BILL.x || 0; BILL.p = +BILL.p || 0;
  BILL.f = +BILL.f || 0;
  BILL.h = BILL.h || ''; BILL.y = BILL.y || '';
  BILL.e = Math.floor(+BILL.e) || 0;
  if(BILL.e < 2) BILL.e = 0;
  EVEN = BILL.e > 1;
  RO = EVEN || HOST;   // host already paid: nothing to claim
  KEY = location.hash.slice(1, 33);
  STATE = BILL.i.map(function(){ return {on:false, units:1, div:1}; });
  restore();
  render();
  if(!RO) STATE.forEach(function(s, i){
    if(s.on){ $('it'+i).classList.add('on'); }
    var chips = $('it'+i).querySelectorAll('[data-div]');
    for(var k=0;k<chips.length;k++)
      chips[k].classList.toggle('on', chips[k].dataset.div === i+'|'+s.div);
  });
  recalc();
}).catch(function(err){
  if(err && err.message === 'nostream')
    fail('Your browser is out of date', 'This bill needs a newer browser to open. Update and try the link again.');
  else if(!location.hash)
    fail('No bill loaded', 'Open the link whoever paid sent you, or scan their QR code.');
  else
    fail('That link is broken', 'Some of it may have been cut off. Ask for the full link again.');
});
})();
</script>
